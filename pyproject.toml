[project]
name = "aiengineer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { email = "suryasaichanti@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "openai>=3.13.0",
    "python-dotenv>=1.2.3",
]

[project.scripts]
aiengineer = "aiengineer:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
]
